channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.*
  - pip
  - ninja
postinstall: |
  # Install PyTorch (adjust CUDA version if needed)
  pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121

  # FlashAttention needs torch available during build; disable build isolation.
  # H200 compute capability is 9.0, set arch list to avoid "no GPU" build failures.
  TORCH_CUDA_ARCH_LIST="9.0" MAX_JOBS=8 pip install flash-attn --no-build-isolation

  # TeamTR dependencies (from requirements.txt, excluding flash-attn)
  pip install accelerate codetiming datasets dill hydra-core liger-kernel \
      cachetools pillow pyyaml regex "numpy<2.0.0" pandas peft "pyarrow>=19.0.0" pybind11 pylatexenc pre-commit \
      "ray[default]" "tensordict>=0.8.0,<=0.9.1,!=0.9.0" torchdata transformers \
      wandb packaging uvicorn fastapi latex2sympy2_extended math_verify

  # Install local TeamTR/verl in editable mode for module resolution.
  # Note: When creating the environment, cd to the TeamTR directory first,
  # then run: micromamba create -f teamtr-env.yml -y
  pip install -e .
