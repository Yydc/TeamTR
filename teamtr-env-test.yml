channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.*
  - pip
postinstall: |
  # Install PyTorch (adjust CUDA version if needed)
  pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121

  # Minimal TeamTR deps for smoke test (skip flash-attn/liger-kernel)
  pip install accelerate codetiming datasets dill hydra-core \
      cachetools pillow pyyaml regex "numpy<2.0.0" pandas peft "pyarrow>=19.0.0" pybind11 pylatexenc pre-commit \
      "ray[default]" "tensordict>=0.8.0,<=0.9.1,!=0.9.0" torchdata transformers \
      wandb packaging uvicorn fastapi latex2sympy2_extended math_verify
