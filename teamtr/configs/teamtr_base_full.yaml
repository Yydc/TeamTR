defaults:
  - ppo_trainer
  - _self_

trainer:
  project_name: teamtr
  experiment_name: teamtr_full
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 3
  save_freq: 50
  test_freq: 10
  logger: ["console"]
  resume_mode: auto
  default_local_dir: .//checkpoints/${trainer.experiment_name}
  max_actor_ckpt_to_keep: 3

data:
  format: multi_agent_turn
  train_files:
    - ./data/dapo_math_17k/processed/train.parquet
    - ./data/deepscaler_preview/processed/train.parquet
  val_files:
    - ./data/dapo_math_17k/processed/val.parquet
    - ./data/deepscaler_preview/processed/val.parquet
  max_prompt_length: 512
  max_response_length: 768
  truncation: error
  dataloader_num_workers: 4
  context_key: context
  response_key: response
  agent_id_key: agent_id
  turn_id_key: turn_id
  conversation_id_key: conversation_id

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

teamtr_router: random_batch
teamtr_router_seed: 42

actor_rollout_ref:
  model:
    lora_rank: 0
    enable_gradient_checkpointing: true
  rollout:
    name: multi_agent_hf
    mode: sync
    n: 4
    max_model_len: 2048
    log_prob_micro_batch_size_per_gpu: 1
  actor:
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 4
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0.0
  ref:
    fsdp_config:
      param_offload: true
    log_prob_micro_batch_size_per_gpu: 1
