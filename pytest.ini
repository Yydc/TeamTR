[pytest]
# Pytest configuration for TeamTR

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    requires_gpu: marks tests that require GPU
    requires_models: marks tests that require model files
    requires_datasets: marks tests that require dataset files

# Ignore patterns
norecursedirs = .git .tox dist build *.egg outputs logs

# Coverage (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=verl --cov=teamtr --cov-report=html --cov-report=term
